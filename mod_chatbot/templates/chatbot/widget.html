<!-- Floating Chat Widget -->
<style>
  #chat-widget-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 1050;
  }

  #chat-toggle-btn {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border: none;
    color: white;
    font-size: 1.4rem;
    box-shadow: 0 4px 20px rgba(102, 126, 234, 0.5);
    transition: transform 0.2s, box-shadow 0.2s;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #chat-toggle-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 28px rgba(102, 126, 234, 0.7);
  }

  #chat-box {
    width: 360px;
    height: 520px;
    border-radius: 20px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: slideUp 0.25s ease;
    background: #ffffff;
  }

  @keyframes slideUp {
    from {
      opacity: 0;
      transform: translateY(20px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .chat-header {
    background: linear-gradient(135deg, #667eea, #764ba2);
    padding: 14px 16px;
    color: white;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .chat-avatar {
    width: 36px;
    height: 36px;
    background: rgba(255, 255, 255, 0.25);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
  }

  .chat-header select {
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: white;
    border-radius: 8px;
    padding: 2px 6px;
    font-size: 0.72rem;
    cursor: pointer;
  }

  .chat-header select option {
    background: #4a4a8a;
    color: white;
  }

  #widget-messages {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #f8f9ff;
  }

  #widget-messages::-webkit-scrollbar {
    width: 4px;
  }

  #widget-messages::-webkit-scrollbar-thumb {
    background: #ccc;
    border-radius: 4px;
  }

  .w-msg {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 0.85rem;
    line-height: 1.4;
    word-break: break-word;
  }

  .w-msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border-bottom-right-radius: 4px;
  }

  .w-msg.bot {
    align-self: flex-start;
    background: white;
    color: #333;
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 6px rgba(0, 0, 0, 0.08);
  }

  .w-msg .sentiment-tag {
    font-size: 0.65rem;
    margin-top: 5px;
    opacity: 0.8;
  }

  .sentiment-Positive {
    border-left: 3px solid #22c55e;
  }

  .sentiment-Negative {
    border-left: 3px solid #ef4444;
  }

  .sentiment-Neutral {
    border-left: 3px solid #94a3b8;
  }

  .sentiment-Frustrated {
    border-left: 3px solid #f97316;
  }

  .sentiment-Grateful {
    border-left: 3px solid #a855f7;
  }

  .sentiment-Excited {
    border-left: 3px solid #eab308;
  }

  .sentiment-Concerned {
    border-left: 3px solid #3b82f6;
  }

  .typing-indicator {
    display: flex;
    gap: 4px;
    padding: 10px 14px;
    background: white;
    border-radius: 18px;
    border-bottom-left-radius: 4px;
    width: fit-content;
    box-shadow: 0 1px 6px rgba(0, 0, 0, 0.08);
  }

  .typing-dot {
    width: 7px;
    height: 7px;
    background: #aaa;
    border-radius: 50%;
    animation: typingBounce 1.2s infinite;
  }

  .typing-dot:nth-child(2) {
    animation-delay: 0.2s;
  }

  .typing-dot:nth-child(3) {
    animation-delay: 0.4s;
  }

  @keyframes typingBounce {

    0%,
    60%,
    100% {
      transform: translateY(0);
    }

    30% {
      transform: translateY(-6px);
    }
  }

  .chat-footer {
    padding: 10px 12px;
    background: white;
    border-top: 1px solid #eee;
  }

  .chat-footer .input-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .chat-footer input {
    flex: 1;
    border: 1.5px solid #e2e8f0;
    border-radius: 24px;
    padding: 9px 16px;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.2s;
  }

  .chat-footer input:focus {
    border-color: #667eea;
  }

  .chat-footer .send-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.15s;
  }

  .chat-footer .send-btn:hover {
    transform: scale(1.1);
  }

  .chat-footer .footer-links {
    display: flex;
    justify-content: center;
    margin-top: 6px;
  }

  .chat-footer .footer-links a {
    font-size: 0.68rem;
    color: #94a3b8;
    text-decoration: none;
  }

  .chat-footer .footer-links a:hover {
    color: #667eea;
  }
</style>

<div id="chat-widget-container">
  <div id="chat-box" class="d-none mb-3">
    <!-- Header -->
    <div class="chat-header">
      <div class="chat-avatar">
        <i class="bi bi-stars"></i>
      </div>
      <div class="flex-grow-1">
        <div style="font-weight:600; font-size:0.9rem;">CharitySphere AI</div>
        <div style="font-size:0.7rem; opacity:0.8;">Always here to help</div>
      </div>
      <select id="widget-lang" title="Select Language">
        {% for lang in request.session.languages|default:"" %}{% endfor %}
      </select>
      <button style="background:none;
                     border:none;
                     color:white;
                     font-size:1.1rem;
                     cursor:pointer;
                     padding:2px 4px"
              id="widget-close"
              title="Close">✕</button>
    </div>

    <!-- Messages -->
    <div id="widget-messages">
      <div class="w-msg bot">
        👋 Hi! I'm the CharitySphere AI. I can help you <strong>donate</strong>, find <strong>volunteer opportunities</strong>, or navigate the platform. What can I do for you?
      </div>
    </div>

    <!-- Footer -->
    <div class="chat-footer">
      <div class="input-row">
        <input type="text" id="widget-input" placeholder="Ask me anything…" autocomplete="off" />
        <button class="send-btn" id="widget-send" title="Send">
          <i class="bi bi-send-fill" style="font-size:0.8rem;"></i>
        </button>
      </div>
      <div class="footer-links">
        <a href="{% url 'chatbot:full_screen' %}">Open full conversation ↗</a>
      </div>
    </div>
  </div>

  <!-- Toggle Button -->
  <div style="display:flex;justify-content:flex-end;">
    <button id="chat-toggle-btn" title="Chat with AI">
      <i class="bi bi-stars" id="chat-icon"></i>
    </button>
  </div>
</div>

<script>
  (function() {
    // ── Language list ──────────────────────────────────────────────
    const LANGUAGES = ["Afrikaans", "Albanian", "Amharic", "Arabic", "Armenian", "Assamese", "Azerbaijani", "Basque", "Belarusian", "Bengali", "Bosnian", "Bulgarian", "Catalan", "Chinese (Simplified)", "Chinese (Traditional)", "Croatian", "Czech", "Danish", "Dutch", "English", "Estonian", "Farsi", "Filipino", "Finnish", "French", "Galician", "Georgian", "German", "Greek", "Gujarati", "Hebrew", "Hindi", "Hungarian", "Icelandic", "Indonesian", "Italian", "Japanese", "Kannada", "Kazakh", "Khmer", "Korean", "Lao", "Latvian", "Lithuanian", "Macedonian", "Malay", "Malayalam", "Marathi", "Mongolian", "Nepali", "Norwegian", "Odia", "Polish", "Portuguese", "Punjabi", "Romanian", "Russian", "Serbian", "Slovak", "Slovenian", "Spanish", "Swahili", "Swedish", "Tamil", "Telugu", "Thai", "Turkish", "Ukrainian", "Urdu", "Uzbek", "Vietnamese", "Zulu"];

    const langSelect = document.getElementById('widget-lang');
    LANGUAGES.forEach(l => {
      const opt = document.createElement('option');
      opt.value = l;
      opt.textContent = l;
      if (l === 'English') opt.selected = true;
      langSelect.appendChild(opt);
    });

    // ── DOM refs ────────────────────────────────────────────────────
    const toggleBtn = document.getElementById('chat-toggle-btn');
    const chatBox = document.getElementById('chat-box');
    const closeBtn = document.getElementById('widget-close');
    const input = document.getElementById('widget-input');
    const sendBtn = document.getElementById('widget-send');
    const messages = document.getElementById('widget-messages');
    const chatIcon = document.getElementById('chat-icon');

    // ── Toggle ──────────────────────────────────────────────────────
    toggleBtn.onclick = () => {
      chatBox.classList.toggle('d-none');
      chatIcon.className = chatBox.classList.contains('d-none') ? 'bi bi-stars' : 'bi bi-x-lg';
    };
    closeBtn.onclick = () => {
      chatBox.classList.add('d-none');
      chatIcon.className = 'bi bi-stars';
    };

    // ── Helpers ─────────────────────────────────────────────────────
    const SENTIMENT_EMOJI = {
      Positive: '😊',
      Negative: '😔',
      Neutral: '💬',
      Frustrated: '😤',
      Grateful: '🙏',
      Excited: '🎉',
      Concerned: '🤔'
    };

    function addMessage(text, role, sentiment = null) {
      const div = document.createElement('div');
      div.className = `w-msg ${role}`;
      if (role === 'bot' && sentiment) div.classList.add(`sentiment-${sentiment}`);

      // Convert URL-like paths to clickable links
      const linked = text.replace(/(\/[\w\-\/]+\/)/g, '<a href="$1" style="color:inherit;text-decoration:underline dotted;">$1</a>');
      div.innerHTML = linked;

      if (role === 'bot' && sentiment) {
        const tag = document.createElement('div');
        tag.className = 'sentiment-tag';
        tag.textContent = `${SENTIMENT_EMOJI[sentiment] || '💬'} ${sentiment}`;
        div.appendChild(tag);
      }
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function showTyping() {
      const el = document.createElement('div');
      el.id = 'widget-typing';
      el.className = 'typing-indicator';
      el.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
      messages.appendChild(el);
      messages.scrollTop = messages.scrollHeight;
    }

    function removeTyping() {
      const el = document.getElementById('widget-typing');
      if (el) el.remove();
    }

    // ── Send ────────────────────────────────────────────────────────
    async function send() {
      const msg = input.value.trim();
      if (!msg) return;
      addMessage(msg, 'user');
      input.value = '';
      showTyping();
      sendBtn.disabled = true;

      try {
        const res = await fetch("{% url 'chatbot:send_message' %}", {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: msg,
            language: langSelect.value,
            context_count: 10
          })
        });
        const data = await res.json();
        removeTyping();
        if (data.status === 'success') addMessage(data.response, 'bot', data.sentiment);
        else addMessage('⚠️ Something went wrong. Please try again.', 'bot');
      } catch {
        removeTyping();
        addMessage('⚠️ Unable to reach the server.', 'bot');
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    sendBtn.onclick = send;
    input.onkeydown = e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    };
  })();
</script>
