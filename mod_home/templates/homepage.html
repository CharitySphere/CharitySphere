{% extends 'base.html' %}
{% block title %}CharitySphere - Get Started{% endblock %}
{% block content %}

<!-- Step 0: Entry Point -->
<section class="vh-100 d-flex align-items-center justify-content-center">
  <article class="card shadow-sm border-0 p-4 text-center">
    <div class="card-body">
      <div class="mb-5">
        <div class="display-6 fw-bold text-dark">Welcome to CharitySphere</div>
        <p class="text-muted">Building Trust, Connecting Hearts.</p>
      </div>

      <div class="d-grid gap-3 col-lg-7 mx-auto">
        <a href="{% url 'login' %}" class="btn btn-primary btn-lg rounded-pill shadow-sm">
          <i class="bi bi-box-arrow-in-right me-2"></i>Login to My Account
        </a>

        <div class="position-relative my-2">
          <hr />
          <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 text-muted small">OR</span>
        </div>

        <a href="{% url 'signup_step_1' %}" class="btn btn-outline-dark btn-lg rounded-pill">
          <i class="bi bi-person-plus me-2"></i>Create New Account
        </a>
      </div>

      <p class="mt-4 small text-muted">
        Join our AI-powered ecosystem for transparent giving.
      </p>
    </div>
  </article>
</section>

{% endblock %}
