{% extends 'base.html' %}
{% block title %}Step 1 - Role Selection{% endblock %}
{% block content %}

  <section class="vh-100 d-flex align-items-center justify-content-center">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card shadow-sm border-0 p-3">
            <div class="card-body">
              <div class="mb-4">
                <div class="progress mb-3" style="height: 5px;">
                  <div class="progress-bar w-33" role="progressbar"></div>
                </div>
                <h2 class="h4 fw-bold">Select Your Role</h2>
                <p class="text-muted small">Step 1 of 3: How do you want to help?</p>
              </div>

              <form method="post" class="d-grid gap-3">
                {% csrf_token %}

                <!-- Donor -->
                <input type="radio" class="btn-check" name="user_type" id="donor" value="donor">
                <label for="donor"
                       class="btn btn-outline-primary p-3 text-start d-flex align-items-center justify-content-between role-option">
                  <div>
                    <i class="bi bi-gift fs-4 me-3"></i>
                    <strong>Donor</strong>
                  </div>
                  <i class="bi bi-chevron-right"></i>
                </label>

                <!-- Volunteer -->
                <input type="radio" class="btn-check" name="user_type" id="volunteer" value="volunteer">
                <label for="volunteer"
                       class="btn btn-outline-success p-3 text-start d-flex align-items-center justify-content-between role-option">
                  <div>
                    <i class="bi bi-people fs-4 me-3"></i>
                    <strong>Volunteer</strong>
                  </div>
                  <i class="bi bi-chevron-right"></i>
                </label>

                <!-- Institution -->
                <input type="radio" class="btn-check" name="user_type" id="institution" value="institution">
                <label for="institution"
                       class="btn btn-outline-warning p-3 text-start d-flex align-items-center justify-content-between role-option">
                  <div>
                    <i class="bi bi-building fs-4 me-3"></i>
                    <strong>Institution</strong>
                  </div>
                  <i class="bi bi-chevron-right"></i>
                </label>

                <!-- Next -->
                <div class="d-grid gap-2">
                  <button type="submit" class="btn btn-primary btn-lg" disabled id="nextBtn">Next: Create Account</button>
                  <a href="{% url 'homepage' %}" class="btn btn-link btn-sm text-muted">Go Back</a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>


  <script>
    const radios = document.querySelectorAll('input[name="user_type"]');
    const nextBtn = document.getElementById('nextBtn');

    radios.forEach(radio => {
      radio.addEventListener('change', () => {
        nextBtn.disabled = false;
      });
    });
  </script>

{% endblock %}
