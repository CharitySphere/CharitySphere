<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}Charity Sphere{% endblock %}
    </title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />

    <!-- Custom Style -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          Segoe UI,
          sans-serif;
      }
    </style>
  </head>

  <body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
      <div class="container">
        <a class="navbar-brand" href="/">
          <!-- <i class="bi bi-heart-fill me-2"></i> -->
          <b>CHARITYSPHERE</b>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
          </ul>

          <ul class="navbar-nav">
            {% if user.is_authenticated %}
              <li class="nav-item">
                <a class="nav-link" href="{% url 'logout' %}">
                  <i class="bi bi-box-arrow-right"></i> Logout
                </a>
              </li>
            {% endif %}
          </ul>
        </div>
      </div>
    </nav>

    <!-- Messages/Alerts -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    {% if messages %}
    <script>
      {% for message in messages %}
        Toastify({
          text: '{{ message|escapejs }}',
          duration: 3000,
          close: true,
          gravity: 'top', // 'top' or 'bottom'
          position: 'right', // 'left', or 'right'
          backgroundColor: '{% if message.tags == "success" %}#40a02b{% elif message.tags == "error" %}#F44336{% elif message.tags == "warning" %}#FF9800{% else %}#2196F3{% endif %}',
          stopOnFocus: true
        }).showToast();
      {% endfor %}
    </script>
    {% endif %}

    <!-- Main Content -->
    <main class="bg-light">
      <div class="container">
        {% block content %}<!-- Page content goes here -->{% endblock %}
      </div>
    </main>

    <!-- Footer -->
    <!-- <footer class="fixed-bottom py-3 bg-white border-top">
      <div class="container text-center">
        <span class="text-muted small">&copy; 2024 CharitySphere. Purely Transparent.</span>
      </div>
</footer> -->

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    {% block extra_js %}{% endblock %}
  </body>
</html>
